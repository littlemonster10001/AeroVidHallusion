# AeroMirage baseline: Qwen3-VL 32B (vLLM).
# Any field can be overridden on the command line as key=value, e.g. runtime.limit=20.

model:
  family: qwen3_vl_vllm       # adapter in aeromirage/models/
  path: /data01/public/Qwen/Qwen3-VL-32B-Instruct # checkpoint directory
  trust_remote_code: false    # true: run the code shipped with the checkpoint
  local_files_only: true      # true: read the checkpoint from model.path only, never download
  options:
    dtype: bfloat16           # weight precision
    tensor_parallel_size: 4   # GPUs the model is split over
    pipeline_parallel_size: 1 # pipeline-parallel stages
    gpu_memory_utilization: 0.95 # share of each GPU's memory vLLM may use
    max_model_len: 32768      # max tokens per request (prompt + answer)
    max_num_seqs: 1           # one question at a time
    enforce_eager: false      # false: CUDA graphs allowed
    enable_prefix_caching: false # false: every question is computed from scratch
    disable_log_stats: true   # true: no periodic vLLM throughput logs
    # FlashInfer's sampling kernels need a JIT build with a recent CUDA toolkit; greedy decoding does not use them
    use_flashinfer_sampler: false

dataset:
  root: /data01/yeziheng/Dataset/DroneVidHalluBench # AeroMirage folder holding QA/ and the videos
  video_dir: video_reencoded  # video folder inside dataset.root
  task: all                   # all | objective | binary_verification | single_choice | multiple_choice | open_ended

video:
  # Video reading: the official qwen_vl_utils.process_vision_info (qwen-vl-utils 0.0.14, patch size 16)
  num_frames: 32              # frames sampled uniformly per video, the same for every model (qwen-vl-utils nframes; must be even)
  min_pixels: 131072          # min pixels per frame = 128 x 32 x 32 (official default)
  max_pixels: 301056          # max pixels per frame (official default: 786432 = 768 x 32 x 32)
  video_reader_backend: decord # video decoder used by qwen-vl-utils

generation:
  multiple_choice: per_option # per_option: each ordinary option asked as a yes/no question, the options answered
                              # yes form the answer (meta options not asked); whole: one answer listing the options
  limits:
    binary_verification: 64   # max new tokens per answer
    single_choice: 64         # max new tokens per answer
    multiple_choice: 64       # max new tokens per answer
    open_ended: 256           # max new tokens per answer

output:
  predictions: outputs/predictions/qwen3_vl_32b_vllm.jsonl # one line per question: its raw answer
  resume: true                # true: continue an existing file, skipping answered questions
  retry_errors: true          # true: when resuming, answer the failed questions again
  overwrite: false            # true: start the file over

runtime:
  limit: 0                    # only the first N questions (0: all)
  limit_per_task: 0           # only the first N questions of each format (0: all)
  seed: 42                    # random seed (decoding is greedy)
  fail_fast: false            # true: stop at the first failed question
