# AeroMirage baseline: Keye-VL-1.5 8B (vLLM).
# Any field can be overridden on the command line as key=value, e.g. runtime.limit=20.

model:
  family: keye_vl_vllm        # adapter in aeromirage/models/
  path: /data01/public/Keye-VL-1_5-8B # checkpoint directory
  trust_remote_code: true     # true: run the code shipped with the checkpoint
  local_files_only: true      # true: read the checkpoint from model.path only, never download
  options:
    dtype: bfloat16           # weight precision
    tensor_parallel_size: 1   # GPUs the model is split over
    pipeline_parallel_size: 1 # pipeline-parallel stages
    gpu_memory_utilization: 0.9 # share of each GPU's memory vLLM may use
    max_model_len: 98304      # max tokens per request (prompt + answer)
    max_num_seqs: 1           # one question at a time
    enforce_eager: false      # false: CUDA graphs allowed
    enable_prefix_caching: false # false: every question is computed from scratch
    disable_log_stats: true   # true: no periodic vLLM throughput logs
    use_flashinfer_sampler: false # false: greedy decoding does not need FlashInfer's sampling kernels
    enable_thinking: false    # thinking mode of the chat template on / off
    engine_kwargs:
      # Keye's dynamic slow/fast encoding can exceed one default encoder slot.
      limit_mm_per_prompt:
        video: 2              # video inputs per prompt
        image: 0              # no image inputs
      # Avoid the repeated-video frame_types cache mismatch in vLLM 0.29.
      mm_processor_cache_gb: 0.0

dataset:
  root: /data01/yeziheng/Dataset/DroneVidHalluBench # AeroMirage folder holding QA/ and the videos
  video_dir: video_reencoded  # video folder inside dataset.root
  task: all                   # all | objective | binary_verification | single_choice | multiple_choice | open_ended

video:
  # Video reading: the official keye_vl_utils.process_vision_info (keye-vl-utils 1.5.2)
  num_frames: 32              # frames sampled uniformly per video, the same for every model (Keye's max_frames; Keye has no nframes)
  min_pixels: 37632           # min pixels per frame = 48 x 28 x 28 (official default VIDEO_MIN_PIXELS)
  max_pixels: 301056          # max pixels per frame = 384 x 28 x 28 (official default VIDEO_MAX_PIXELS = 602112)

generation:
  limits:
    binary_verification: 64   # max new tokens per answer
    single_choice: 64         # max new tokens per answer
    multiple_choice: 64       # max new tokens per answer
    open_ended: 256           # max new tokens per answer

output:
  predictions: outputs/predictions/keye_vl_1_5_8b_vllm.jsonl # one line per question: its raw answer
  resume: true                # true: continue an existing file, skipping answered questions
  retry_errors: true          # true: when resuming, answer the failed questions again
  overwrite: false            # true: start the file over

runtime:
  limit: 0                    # only the first N questions (0: all)
  limit_per_task: 0           # only the first N questions of each format (0: all)
  seed: 42                    # random seed (decoding is greedy)
  fail_fast: false            # true: stop at the first failed question
